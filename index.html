<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Pagamento Pix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">Gerar Pix de Pagamento</h1>
        
        <div id="form-container">
            <div class="mb-4 text-left">
                <label class="block text-slate-700 font-semibold mb-2">Seu Nome</label>
                <input type="text" id="name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Digite seu nome">
            </div>
            <div class="mb-4 text-left">
                <label class="block text-slate-700 font-semibold mb-2">Seu E-mail</label>
                <input type="email" id="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="seu@email.com">
            </div>
            <div class="mb-6 text-left">
                <label class="block text-slate-700 font-semibold mb-2">Valor (R$)</label>
                <input type="number" id="amount" step="0.01" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00">
            </div>
            <button onclick="gerarPix()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">
                Gerar QR Code Pix
            </button>
        </div>

        <div id="result-container" class="hidden mt-6">
            <h2 class="text-lg font-semibold text-slate-700 mb-2">Escaneie o QR Code</h2>
            <img id="qr-image" src="" alt="QR Code Pix" class="mx-auto mb-4 w-48 h-48">
            
            <label class="block text-slate-700 font-semibold mb-1 text-sm">Pix Copia e Cola:</label>
            <textarea id="copia-e-cola" readonly class="w-full h-20 px-2 py-1 text-xs border rounded bg-slate-50 mb-2"></textarea>
            
            <button onclick="copiarTexto()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Copiar Código Pix
            </button>
        </div>
    </div>

    <script>
        async function gerarPix() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const amount = document.getElementById('amount').value;

            if (!amount) {
                alert('Por favor, informe o valor.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/gerar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, amount })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('qr-image').src = data.qr_code_image;
                    document.getElementById('copia-e-cola').value = data.pix_copia_e_cola;
                    
                    document.getElementById('form-container').classList.add('hidden');
                    document.getElementById('result-container').classList.remove('hidden');
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
                console.error(err);
            }
        }

        function copiarTexto() {
            const copiaCola = document.getElementById('copia-e-cola');
            copiaCola.select();
            navigator.clipboard.writeText(copiaCola.value);
            alert('Código Pix copiado com sucesso!');
        }
    </script>
</body>
</html>
